[package]
name = "pillar"
version = "2.0.0-alpha.1"
edition = "2024"
default-run = "plrc"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/roazanas/pillar"
readme = "README.md"
description = "Compiler for the Pillar language (https://github.com/roazanas/pillar)"
authors = ["Nikita Zhulanov <me@rznz.ru>"]

[dependencies]
logos = "0.16.1"
env_logger = "0.11.11"
cranelift = "0.137.1"
cranelift-native = "0.137.1"
cranelift-module = "0.137.1"
cranelift-object = "0.137.1"
clap = { version = "4.6.7", features = ["color", "derive"] }
clap_complete = "4.6.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-width = "0.2.3"

[build-dependencies]
cc = "1.10.0"


[[bin]]
name = "plrc"
path = "src/main.rs"

[target.'cfg(target_env = "msvc")'.dependencies]
cc = "1.10.0"

[features]
fuzzing = []

[[bin]]
name = "plrc-fuzz"
path = "tools/fuzz_frontend.rs"
required-features = ["fuzzing"]
