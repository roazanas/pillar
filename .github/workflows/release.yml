name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify version matches the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["package"]["version"]'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: pillar-*
          path: artifacts
          merge-multiple: true
      - name: Publish tested archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --prerelease artifacts/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes artifacts/*
          fi
